# 投入量の測定(#107)
#
# 標準 7.7.2 の予算統制の指標を計算するための実測を、時系列で残します。
# 1回だけ数えて終わると、次に気づくのはまた誰かが手で数えたときです。
#
# 機械で取れるもの(PR の分類・行数)だけを測り、台帳へ追記する PR を出します。
# **稼働時間と AI 実行費の金額は人が書きます。** PR の本文でその欄を促します。
#
# AI の使用量(トークン)は Claude Code のセッション記録から取れますが、
# 記録は利用者のマシンにあり CI からは読めません。手元で
# `node scripts/gate/investment-measure.mjs --ai-usage ~/.claude/projects` を
# 実行して台帳へ書きます。

name: investment-measure

on:
  schedule:
    - cron: '0 21 * * 0' # UTC 日 21:00 = JST 月 06:00
  workflow_dispatch:

permissions:
  contents: write
  pull-requests: write

jobs:
  measure:
    name: investment-measure
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: 測る
        id: measure
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          node scripts/gate/investment-measure.mjs --markdown > /tmp/measure.md
          cat /tmp/measure.md

      - name: 台帳へ追記する PR を出す
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -eu
          today=$(date -u +%F)
          branch="chore/investment-${today}"
          ledger="docs/platform/investment-ledger.md"

          if git ls-remote --exit-code --heads origin "$branch" >/dev/null 2>&1; then
            echo "::notice::${branch} は既にあります。二重に出しません"
            exit 0
          fi

          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git switch -c "$branch"

          {
            printf '\n---\n\n## %s\n\n' "$today"
            printf '### 人が書く欄\n\n'
            printf '| 項目 | 値 | 出所 |\n| --- | --- | --- |\n'
            printf '| 稼働時間(累計) | **未記入** | |\n'
            printf '| AI 実行費(累計) | **未記入** | |\n'
            printf '| 進捗率 | **未記入** | |\n'
            printf '| 消化進捗比 | **未記入** | |\n\n'
            cat /tmp/measure.md
          } >> "$ledger"

          git add "$ledger"
          git commit -m "chore: 投入量の実測を台帳へ追記する(${today})" -m "Spec: Issue-107"
          git push -u origin "$branch"

          gh pr create --base main --head "$branch" \
            --title "chore: 投入量の実測を台帳へ追記する(${today})" \
            --label "state:needs-po" \
            --body "$(printf '定期実行による追記です。\n\n**機械で取れる値だけが入っています。**\n\n次の4つは人が書いてください。書かないままマージすると、消化進捗比が計算できません。\n\n| 項目 | 誰が |\n| --- | --- |\n| 稼働時間 | PO |\n| AI 実行費(金額) | PO |\n| 進捗率 | PO |\n| 消化進捗比 | PO |\n\n**AI の使用量(トークン)は手元でしか測れません。** 次を実行して貼ってください。\n\n```\nnode scripts/gate/investment-measure.mjs --markdown --ai-usage ~/.claude/projects\n```\n\nSpec: Issue-107\n')"
