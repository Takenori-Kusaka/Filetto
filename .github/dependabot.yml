# 依存関係の更新
#
# ------------------------------------------------------------------
# 見送りの規則
# ------------------------------------------------------------------
#
# 更新を取り込めない場合、**PR を放置しません**。次のいずれかを行います。
#
#   1. 直せるなら直す(例: 別の版へ上げる)
#   2. 直せないなら、ignore へ**理由と見直し期限を書いて**登録する
#
# 「あとで見る」で PR を開いたままにする運用を採りません。開いたままの PR は、
# 見送ったのか忘れたのかを区別できません。ピットイン方式の「宣言のない省略は
# 追跡できない」(第8章 テーラリング)と同じ理由によります。
#
# ignore へ書くときは、次を必ず添えます。
#
#   - 何が起きるのか(観測できる事象で書く。「動かない」だけでは足りない)
#   - いつ見直すのか(YYYY-MM。期限のない除外を作らない)
#   - 何が得られたら解除するのか
#
# 書式の例:
#
#   ignore:
#     # 3.0.0 で <検査名> が誤検知し、G-5 が通らなくなる。
#     # 見直し 2026-12。上流の修正版が出たら解除する。
#     - dependency-name: "example-lib"
#       versions: ["3.0.0"]
#
# ------------------------------------------------------------------
# このテンプレートから作ったリポジトリでの扱い
# ------------------------------------------------------------------
#
# 依存関係の追加・更新は、独立レビュー(G-6)の必須確認事項です
# (判定基準5「依存追加の必要性の確認」)。dependabot の PR も例外ではありません。
#
# また G-5 の基準5(依存関係のライセンス検査)は合否条件です。許可リストにない
# ライセンスの依存が入ると、この PR は通りません。
#
# npm 以外を使う場合は、下の package-ecosystem を差し替えてください。
# pip / gomod / cargo / bundler / composer などが指定できます。

version: 2
updates:
  - package-ecosystem: npm
    directory: /
    schedule:
      interval: monthly
    groups:
      all-deps:
        patterns: ["*"]
    ignore: []

  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: monthly
    ignore: []
