[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "filetto"
version = "0.0.0"
description = "人にも AI にも検索可能なファイル倉庫"
readme = "README.md"
requires-python = ">=3.12"
license = "AGPL-3.0-or-later"
license-files = ["LICENSE"]
authors = [{ name = "Takenori Kusaka" }]
dependencies = []

[project.optional-dependencies]
dev = [
  "pytest>=8",
  "pytest-cov>=5",
  "ruff>=0.6",
  "pip-audit>=2.7",
  "pip-licenses>=5",
]

[tool.hatch.build.targets.wheel]
packages = ["src/filetto"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]

[tool.coverage.run]
source = ["src/filetto"]
branch = true

[tool.coverage.report]
show_missing = true

[tool.ruff]
line-length = 100
src = ["src", "tests"]

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]
