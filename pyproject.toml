[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "filetto"
version = "0.0.0"
description = "人にも AI にも検索可能なファイル倉庫"
readme = "README.md"
requires-python = ">=3.12"
license = "AGPL-3.0-or-later"
license-files = ["LICENSE"]
authors = [{ name = "Takenori Kusaka" }]
dependencies = [
  # 版の揺れが大きいため、マイナー版まで固定する(ADR-0002)
  "fastapi>=0.162,<0.163",
  "starlette>=1.10,<1.11",
  # 公式 MCP Python SDK。2.x の間も API の改名があるため、マイナー版まで固定する
  "mcp>=2.3,<2.4",
  # Lore の公式 Python SDK(版の保管。F-001 受入基準15〜22)。0.x の間は API が非互換に変わりうるため、
  # マイナー版まで固定する(S0-005 の採用条件4)
  "lore-vcs>=0.11,<0.12",
]

[project.optional-dependencies]
dev = [
  "pytest>=8",
  "pytest-cov>=5",
  "httpx2>=2.16",
  "ruff>=0.6",
  "pip-audit>=2.7",
  "pip-licenses>=5",
]

[tool.hatch.build.targets.wheel]
packages = ["src/filetto"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]

[tool.coverage.run]
source = ["src/filetto"]
branch = true

[tool.coverage.report]
show_missing = true

[tool.ruff]
line-length = 100
src = ["src", "tests"]

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]
